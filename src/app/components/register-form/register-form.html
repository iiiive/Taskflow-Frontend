<div class="register-card">
  <div class="card-header">
    <div class="logo-mark">P</div>

    <div>
      <p class="eyebrow">Start your workspace</p>
      <h2>Create account</h2>
    </div>
  </div>

  <p class="subtitle">
    Join Planora and create your first workspace for tickets, members, activity logs, and progress tracking.
  </p>

  <form (ngSubmit)="Register()" #registerForm="ngForm">
    <div class="form-group">
      <label for="name">Full Name</label>

      <input
        id="name"
        type="text"
        [(ngModel)]="name"
        name="name"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>

      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="charlin@example.com"
        autocomplete="email"
        required
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Create a strong password"
        autocomplete="new-password"
        required
      />
    </div>

    <button type="submit" class="signup-btn" [disabled]="loading || registerForm.invalid">
      <span *ngIf="!loading">Create account</span>
      <span *ngIf="loading">Creating account...</span>
    </button>
  </form>

  <p class="message" *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess">
    {{ message }}
  </p>

  <div class="divider">
    <span></span>
    <p>Already using Planora?</p>
    <span></span>
  </div>

  <a routerLink="/login" class="link">
    Sign in instead
  </a>
</div>
