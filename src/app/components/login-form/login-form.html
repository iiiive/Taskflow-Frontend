<div class="login-card">
  <div class="card-header">
    <div class="logo-mark">P</div>

    <div>
      <p class="eyebrow">Welcome back</p>
      <h2>Sign in to Planora</h2>
    </div>
  </div>

  <p class="subtitle">
    Continue managing your workspaces, tickets, deadlines, and project activity.
  </p>

  <form (ngSubmit)="Login()" #loginForm="ngForm">
    <div class="form-group">
      <label for="email">Email Address</label>

      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="charlin@example.com"
        autocomplete="email"
        required
      />
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="password">Password</label>
        <span>Secure access</span>
      </div>

      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      />
    </div>

    <button type="submit" class="login-btn" [disabled]="loading || loginForm.invalid">
      <span *ngIf="!loading">Sign in</span>
      <span *ngIf="loading">Signing in...</span>
    </button>
  </form>

  <p class="message" *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess">
    {{ message }}
  </p>

  <div class="divider">
    <span></span>
    <p>New to Planora?</p>
    <span></span>
  </div>

  <p class="register-text">
    Create a workspace, invite members, and start tracking tickets.
    <a routerLink="/register" class="link">Create account</a>
  </p>
</div>
