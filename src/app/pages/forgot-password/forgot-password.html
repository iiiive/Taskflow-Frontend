<div class="auth-page">
  <div class="auth-card">
    <div class="card-header">
      <div class="logo-mark">P</div>

      <div>
        <p class="eyebrow">Account recovery</p>
        <h2>Forgot password?</h2>
      </div>
    </div>

    <p class="subtitle">
      Enter your registered email address. Planora will send a 6-digit reset code to that email.
    </p>

    <form (ngSubmit)="sendResetCode()" #forgotForm="ngForm">
      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="charlin@example.com"
          autocomplete="email"
          required
        />

        <small>
          Use the same email address you used when creating your Planora account.
        </small>
      </div>

      <button type="submit" class="primary-action" [disabled]="loading || forgotForm.invalid">
        <span *ngIf="!loading">Send reset code</span>
        <span *ngIf="loading">Sending code...</span>
      </button>
    </form>

    <p class="message" *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess">
      {{ message }}
    </p>

    <div class="divider">
      <span></span>
      <p>Remembered your password?</p>
      <span></span>
    </div>

    <a routerLink="/login" class="link">
      Back to sign in
    </a>
  </div>
</div>
