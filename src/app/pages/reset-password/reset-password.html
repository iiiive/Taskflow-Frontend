<div class="reset-page">
  <section class="reset-card">
    <header class="reset-header">
      <div class="logo-mark">P</div>

      <div>
        <p class="eyebrow">Reset access</p>
        <h1>Create new password</h1>
      </div>
    </header>

    <p class="subtitle">
      Enter the 6-digit code sent to your registered email, then create a new password for your Planora account.
    </p>

    <form (ngSubmit)="resetPassword()" #resetForm="ngForm" class="reset-form">
      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="charlin@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="code">Reset Code</label>

        <input
          id="code"
          type="text"
          name="code"
          [(ngModel)]="code"
          placeholder="Enter 6-digit code"
          maxlength="6"
          inputmode="numeric"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">New Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a new password"
          autocomplete="new-password"
          minlength="8"
          required
        />
      </div>

      <div class="form-group">
        <label for="passwordConfirmation">Confirm New Password</label>

        <input
          id="passwordConfirmation"
          type="password"
          name="passwordConfirmation"
          [(ngModel)]="passwordConfirmation"
          placeholder="Re-enter your new password"
          autocomplete="new-password"
          minlength="8"
          required
        />
      </div>

      <p
        class="password-match-error"
        *ngIf="password && passwordConfirmation && password !== passwordConfirmation"
      >
        Passwords do not match.
      </p>

      <button
        type="submit"
        class="primary-action"
        [disabled]="loading || resetForm.invalid || password !== passwordConfirmation"
      >
        <span *ngIf="!loading">Reset password</span>
        <span *ngIf="loading">Resetting password...</span>
      </button>
    </form>

    <p class="message" *ngIf="message" [class.success]="isSuccess" [class.error]="!isSuccess">
      {{ message }}
    </p>

    <div class="divider">
      <span></span>
      <p>Need another code?</p>
      <span></span>
    </div>

    <a routerLink="/forgot-password" class="link">
      Request new code
    </a>

    <a routerLink="/login" class="back-link">
      Back to sign in
    </a>
  </section>
</div>
